<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Archive - Artists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="artists.css">
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="site-title">Music Archive</a>
    
    <!-- Desktop Navigation -->
    <div class="header-right">
      <a href="artists.html" class="nav-btn active">Artists</a>
      <button class="nav-btn" onclick="openInfo()">Info</button>
    </div>

    <!-- Mobile Navigation Toggle -->
    <button class="hamburger" onclick="toggleMenu()" aria-label="Toggle Navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Mobile Overlay Menu -->
  <div class="mobile-menu" id="mobile-menu">
    <button class="mobile-menu-close" onclick="closeMenu()" aria-label="Close Navigation">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <a href="artists.html" class="nav-btn active" onclick="closeMenu()">Artists</a>
    <button class="nav-btn" onclick="closeMenu(); openInfo();">Info</button>
  </div>

  <!-- Sticky Jump Bar Navigation -->
  <nav class="jump-bar" id="jump-bar" aria-label="Alphabetical navigation"></nav>

  <!-- Main Content Container -->
  <main>
    <div class="search-bar-container" style="margin-bottom: 2rem;">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search artists..." 
        aria-label="Search artists"
        style="width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--faint); color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.85rem; border-radius: 4px;"
      >
    </div>

    <!-- Dynamic Container targeted by JS -->
    <div id="artists-container"></div>
  </main>

  <!-- Info Overlay Modal -->
  <div id="info-overlay">
    <button class="info-close" onclick="closeInfo()" aria-label="Close Info">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <h2 class="info-name">Artist Archive</h2>
    <p class="info-subtitle">Maroon Biology Collection</p>
    <div class="info-bio">
      <p>Explore a curated archive of editorial visual media, documentary stills, and concert imagery across musical artists.</p>
    </div>
    <div class="info-links">
      <a href="index.html" class="info-link">View Main Gallery</a>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; Maroon Biology. All rights reserved.</p>
  </footer>

  <script src="artists.js"></script>
</body>
</html>
